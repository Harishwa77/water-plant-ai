version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: water_plant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: water_plant_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Machine Learning Inference Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: water_plant_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. n8n Automation & Orchestration Backend
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: water_plant_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # 4. Next.js / Vite React Command Center Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water_plant_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_PRODUCTION_WEBHOOK_URL=https://api.agents.snsihub.ai/webhook/upload
    depends_on:
      - ml-service

volumes:
  pgdata:
  n8n_data:
